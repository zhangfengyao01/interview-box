name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认只读；deploy 那个 job 自己再提权（pages + id-token），别一上来就给大权限
permissions:
  contents: read

# 同一分支连续推送时，取消上一次还没跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check · verify · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # checkout@v5 / setup-node@v5 / upload-artifact@v6 都已切到 node24 运行时，
      # 留 v4 会在 runner 上被强制跑在 node24 并产生弃用告警。
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # .npmrc 里开着 ignore-scripts：esbuild 的平台二进制是 optionalDependencies
      # （@esbuild/linux-x64 已在 lock 里），JS API 直接 require 它，不依赖 postinstall。
      - name: 安装依赖
        run: npm ci --no-audit --fund=false

      # strict 模式，覆盖 13 个页面与全部 .vue
      - name: 类型检查
        run: npm run type-check

      # 导出 → 5 条负例 → 清空 → 覆盖恢复 → 合并恢复，30 项断言
      - name: 备份恢复端到端
        run: npm run verify:backup

      # 拆题规则回归：两份真实 OCR 输出（Node 链路 / 浏览器链路）+ 编号格式 + 负例，48 项断言
      - name: 拆题规则回归
        run: npm run verify:segment

      # 示例数据：空库播种 / 老库按版本补种 / 幂等 / 删掉的题不复活
      - name: 示例数据补种
        run: npm run verify:seed

      # 这里刻意不设 UNI_H5_BASE：验的是「本地默认 '/' 地址」这条路径
      - name: 构建 H5
        run: npm run build:h5

      - name: 构建微信小程序
        run: npm run build:mp-weixin

      # 客户端本就存不下密钥，但还是堵一下「不小心把密钥写进源码」这条路。
      #
      # 两个必须的限定：
      # - `--exclude-dir=ocr`：static/ocr 下是 tesseract 的 wasm 内核（压缩后的第三方 JS）
      #   与中文模型，几 MB 随机字节里必然撞上 AKID / sk- 这类规则，实测每次都误伤；
      # - `-I`：二进制文件直接跳过，别让 .gz 模型走进正则。
      # 除这两处外全量扫描，不放宽规则本身。
      - name: 扫描产物中的疑似密钥
        run: |
          if grep -rnI --exclude-dir=ocr -E '(sk-[A-Za-z0-9]{20,}|AKID[A-Za-z0-9]{16,}|gh[pous]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' dist; then
            echo "::error::产物里出现了疑似密钥，请检查"
            exit 1
          fi
          echo "产物中未发现疑似密钥（已跳过 static/ocr 第三方资源与二进制）"

      - name: 上传 H5 产物
        uses: actions/upload-artifact@v6
        with:
          name: dist-h5
          path: dist/build/h5
          retention-days: 7
          if-no-files-found: error

  # 只有 verify 全绿才部署；PR 只验不发布
  deploy:
    name: deploy · GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --fund=false

      # 刻意重新构建，而不是复用 verify 的 dist-h5：
      # Pages 把站点挂在 /interview-box/ 子路径下，产物里的资源必须带这个前缀；
      # verify 那份是用默认 '/' 构建的，直接拿去部署会全站 404（assets 找不到）。
      # 仓库改名或以后绑自定义域名，这里要同步改。
      - name: 构建 H5（Pages 子路径）
        env:
          UNI_H5_BASE: /interview-box/
        run: npm run build:h5

      - name: 读取 Pages 配置
        uses: actions/configure-pages@v6

      - name: 打包站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/build/h5

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v5
